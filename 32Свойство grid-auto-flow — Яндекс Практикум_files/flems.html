<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гриды</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style.css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
  margin: 0;
}

body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 20px;
  min-width: 850px;
  min-height: 100vh;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
  background-color: #feafe8;
}

.container {
  display: grid;
  grid-template-columns: repeat(3, 160px);
  grid-template-rows: repeat(2, 100px);
  grid-auto-columns: 160px;
  grid-auto-rows: 100px;
  gap: 10px;
}

.col {
  grid-auto-flow: column;
}

.block {
  display: flex;
  justify-content: center;
  align-items: center;
  border: 1px solid #000;
}

.block--1 {
  background-color: #fff;
}

.block--2 {
  background-color: #c4c4c4;
}

.block--3 {
  background-color: #80d994;
}

.button {
  border: 1px solid #000;
  padding: 10px 65px;
  color: #000;
  font-family: inherit;
  font-weight: 800;
  font-size: inherit;
  text-transform: uppercase;
  background-color: #ffc802;
  cursor: pointer;
}

.hidden {
  display: none;
}
</style></head>
  <body>
    <div class="container">
      <div class="block block--1"></div>
      <div class="block"></div>
      <div class="block block--2"></div>
      <div class="block block--2"></div>
      <div class="block block--1"></div>
      <div class="block block--3"></div>
      <div class="block"></div>
      <div class="block block--3"></div>
    </div>

    <button class="button hidden">Постройтесь в строку!</button>
    <button class="button">Постройтесь в колонку!</button>
    <script charset="utf-8" src="./script.js.загрузка"></script>
  

</body></html>
