<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Единицы измерения и функции</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style.css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
  margin: 0;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 850px;
  min-height: 100vh;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
}

.cat-title {
  margin-bottom: 30px;
  font-size: 100%;
}

.text-box {
  border: 1px solid #000;
  border-left: none;
  padding: 2.5%;
  background-color: #ffc802;
}

.parent {
  display: flex;
  margin: 0 50px;
  font-size: 30px;
}

.cat-image {
  border: 1px solid #000;
}

.cat-text {
  font-size: 60%;
  line-height: 150%;
}
</style></head>
  <body>
    <div class="parent">
      <img class="cat-image" src="./kitty.png" alt="картинка кота в коробке.">
      <div class="text-box">
        <h2 class="cat-title">Коты — это жидкость</h2>
        <p class="cat-text">
          Они способны занять весь отведённый им объём. Они могут расширяться
          или сжиматься в&nbsp;несколько раз и&nbsp;принимают форму сосуда,
          в&nbsp;котором они находятся.
        </p>
      </div>
    </div>
  

</body></html>
