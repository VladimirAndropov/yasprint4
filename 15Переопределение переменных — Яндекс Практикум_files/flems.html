  <style id="styles/style.css">* {
  box-sizing: border-box;
}

html {
  height: 100vh;
}

body {
  display: grid;
  place-items: center;
  min-width: 450px;
  min-height: 100%;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
}

button {
  border: 1px solid #000;
  padding: 10px 65px;
  color: #000;
  font-family: inherit;
  font-weight: 800;
  font-size: inherit;
  text-transform: uppercase;
  background-color: #ffc802;
  transition: 0.1s;
  cursor: pointer;
}

button {
  --offset: 5px;

  box-shadow: var(--offset) var(--offset) 0 0 #000;
}

button:hover {
  --offset: 10px;
}
</style></head>
