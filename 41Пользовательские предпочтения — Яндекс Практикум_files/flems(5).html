<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Анимация</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style(5).css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
}

.page {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted-l.svg);
}

.button {
  border: 1px solid #000;
  padding: 10px 65px;
  color: #000;
  font-weight: 800;
  font-size: 24px;
  text-transform: uppercase;
  background-color: #ffc802;
  animation: shaking 0.5s linear infinite both;
}

.button:hover {
  box-shadow: inset 0 0 0 100px rgb(0 0 0 / 0.15);
  cursor: pointer;
}

/* Укажите правила для prefers-reduced-motion */

@keyframes shaking {
  0% {
    transform: translateX(0);
  }

  25% {
    transform: translateX(5px);
  }

  50% {
    transform: translateX(-5px);
  }

  75% {
    transform: translateX(5px);
  }

  100% {
    transform: translateX(0);
  }
}
</style></head>
  <body class="page">
    <button class="button">Что-то меня шатает</button>
  

</body></html>
