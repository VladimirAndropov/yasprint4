    <title>Контрастность</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style(7).css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
  margin: 0;
}

.page {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 500px;
  min-height: calc(100vh - 100px);
  padding: 50px;
  font-family: 'Open Sans', sans-serif;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted.svg);
}

.quote {
  max-width: 850px;
  border: 1px solid #000;
  padding: 50px;
  background-color: #fff;
}

.quote__text {
  font-size: 32px;
  font-style: italic;
  line-height: 1.37;
}

.quote__cite {
  display: block;
  margin-block-start: 25px;
  margin-block-end: 0;
  font-size: 18px;
  font-style: italic;
  line-height: 1.4;
  text-align: right;
}

/* Напишите стили для prefers-contrast */
</style></head>
  <body class="page">
    <article class="quote">
      <blockquote class="quote__text">
        «Иллюстрация влияет на зрителя, когда в ней есть напряжение и контраст.
        Чем больше различий между несколькими объектами — тем сильнее контраст.»
      </blockquote>
      <cite class="quote__cite">
        Польский художник Мариуш Становски в книге «Теория и практика контраста»
      </cite>
    </article>
  

</body></html>
