<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Чёрно-белый мир</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style.css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
  margin: 0;
}

html {
  height: 100vh;
}

body {
  --main-text-color: #152028;
  --main-background-color: #fff;

  display: grid;
  place-items: center;
  min-height: 100%;
  color: var(--main-text-color);
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
  background-color: var(--main-background-color);
}

body:has(.theme-toggler__control_type_light:checked) {
  --main-text-color: #152028;
  --main-background-color: #fff;
}

body:has(.theme-toggler__control_type_dark:checked) {
  --main-text-color: #fff;
  --main-background-color: #152028;
}

.title {
  font-weight: 800;
  font-size: 45px;
  text-align: center;
  text-transform: uppercase;
}

.something {
  width: max(250px, 50vw);
  height: max(250px, 50vw);
  background-image: url(./images/tsss.svg);
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
}

.theme-toggler {
  display: flex;
}

.theme-toggler__item {
  position: relative;
  box-sizing: border-box;
  min-width: 125px;
  border: 1px solid var(--main-text-color);
  padding: 5px 20px;
  color: var(--main-text-color);
  font-family: inherit;
  font-weight: 400;
  font-size: inherit;
  text-align: center;
  text-transform: uppercase;
  cursor: pointer;
}

.theme-toggler__control {
  position: absolute;
  -webkit-appearance: none;
  appearance: none;
}

.theme-toggler__item:has(.theme-toggler__control:checked) {
  color: var(--main-background-color);
  font-weight: 800;
  background-color: var(--main-text-color);
}
</style></head>
  <body>
    <h1 class="title">Следуй за белым кроликом!</h1>

    <div class="something"></div>

    <div class="theme-toggler">
      <label class="theme-toggler__item">
        <input class="theme-toggler__control theme-toggler__control_type_light" type="radio" name="theme-scheme" value="light">
        Светлая
      </label>
      <label class="theme-toggler__item">
        <input class="theme-toggler__control theme-toggler__control_type_auto" type="radio" name="theme-scheme" value="auto" checked="">
        Авто
      </label>
      <label class="theme-toggler__item">
        <input class="theme-toggler__control theme-toggler__control_type_dark" type="radio" name="theme-scheme" value="dark">
        Тёмная
      </label>
    </div>
  

</body></html>
