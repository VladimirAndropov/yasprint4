<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Демонстрация PNG</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style.css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 850px;
  min-height: 100vh;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
  background-color: #feafe8;
}

.wrapper {
  display: flex;
  gap: 25px;
  padding: 50px;
}

figure {
  width: 50%;
  margin: 0;
}

figure img {
  width: 100%;
  border: 1px solid #000;
}

figcaption {
  margin-top: 10px;
  font-style: italic;
  text-align: center;
}
</style></head>
  <body>
    <div class="wrapper">
      <figure>
        <img src="./dog_2.jpeg" alt="Картинка со щенком на белом фоне">
        <figcaption>Картинка с фоном (JPEG)</figcaption>
      </figure>
      <figure>
        <img src="./dog.png" alt="Картинка со щенком без фона">
        <figcaption>Картинка без фона (PNG)</figcaption>
      </figure>
    </div>
  

</body></html>
