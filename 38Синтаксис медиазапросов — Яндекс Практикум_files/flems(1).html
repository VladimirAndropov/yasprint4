<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Static Template</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style(1).css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
  margin: 0;
}

.page {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Open Sans', sans-serif;
}

.page::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  width: 100%;
  height: 100%;
  background-color: rgba(0 0 0 / 0.5);
}

.quote {
  max-width: 650px;
  padding: 50px;
  color: #000;
  background-color: #fff;
}

.quote__text {
  font-size: 32px;
  font-style: italic;
  line-height: 1.37;
}

.quote__author {
  margin-block-start: 25px;
  margin-block-end: 0;
  font-size: 18px;
  font-style: italic;
  line-height: 1.4;
  text-align: right;
}

.page__video {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style></head>
  <body class="page">
    <article class="quote">
      <blockquote class="quote__text">
        «Новых идей не существует. Мы просто берём множество старых идей и
        помещаем их в своего рода мысленный калейдоскоп».
      </blockquote>
      <p class="quote__author">Марк Твен</p>
    </article>
    <video autoplay="" loop="" muted="" class="page__video" src="./images/short-movie.mp4"></video>
  

</body></html>
